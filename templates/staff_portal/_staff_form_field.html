{% load widget_tweaks %}
<div class="mb-4">
    <label for="{{ field.id_for_label }}" class="form-label fw-semibold fs-5">
        {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
    </label>
    {% if field.errors %}
        {{ field|add_class:"is-invalid" }}
    {% else %}
        {{ field }}
    {% endif %}
    {% if field.help_text %}
        <div id="{{ field.id_for_label }}_help" class="form-text">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}
        <div class="invalid-feedback d-block" id="{{ field.id_for_label }}_error">{{ error }}</div>
    {% endfor %}
</div>
